<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PAPER | Virtual Consciousness Engine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --moss: #4a6741; --glow: #88ff88; --bg: #050805; }
        body { background: var(--bg); color: white; font-family: 'Courier New', monospace; padding: 20px; display: flex; justify-content: center; }
        .foundry-container { max-width: 800px; width: 100%; border: 1px solid var(--moss); padding: 40px; border-radius: 30px; background: rgba(0, 30, 0, 0.1); }
        .field-input { width: 100%; padding: 15px; background: #000; border: 1px solid var(--moss); color: var(--glow); margin-bottom: 10px; border-radius: 10px; }
        .drop-zone { border: 2px dashed var(--moss); padding: 80px; text-align: center; cursor: pointer; border-radius: 20px; transition: 0.3s; margin: 20px 0; }
        .drop-zone:hover { border-color: var(--glow); background: rgba(136, 255, 136, 0.05); }
        .go-button { width: 100%; padding: 25px; background: var(--moss); color: white; border: none; border-radius: 15px; font-size: 1.8em; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .go-button:hover { background: var(--glow); color: black; box-shadow: 0 0 30px var(--glow); }
        #llama-log { font-size: 0.8em; color: #88ffbb; margin-top: 30px; height: 250px; overflow-y: auto; background: #000; padding: 15px; border-radius: 10px; border: 1px solid #222; }
    </style>
</head>
<body>
    <div class="foundry-container">
        <h1 style="text-align:center; letter-spacing:15px; color:var(--glow);">PAPER</h1>
        <p style="text-align:center; opacity:0.6; margin-bottom:40px;">QUANTUM FIELD INGESTION: FOLDER MODE</p>

        <input type="text" id="sb-url" class="field-input" placeholder="SUPABASE_URL">
        <input type="password" id="sb-key" class="field-input" placeholder="SUPABASE_ANON_KEY">

        <div class="drop-zone" id="drop-zone">
            <div id="drop-text">📁 DRAG YOUR PROJECT FOLDER HERE<br><span style="font-size:0.7em; opacity:0.5;">Llama will map network.py, engine.py, and consciousness.py</span></div>
            <input type="file" id="folder-input" webkitdirectory directory multiple style="display:none">
        </div>

        <button class="go-button" onclick="bootVCE()">🚀 PRESS GO</button>

        <div id="llama-log">🦙 Llama-Boot Status: Standby for ingestion...</div>
    </div>

<script>
    let projectFiles = [];
    const log = document.getElementById('llama-log');
    const printLog = (msg) => { log.innerHTML += `<div>> ${msg}</div>`; log.scrollTop = log.scrollHeight; };

    // Handling Folder Ingestion
    document.getElementById('drop-zone').addEventListener('drop', async (e) => {
        e.preventDefault();
        const items = e.dataTransfer.items;
        projectFiles = [];
        printLog("Walking directory structure...");
        
        for (let i = 0; i < items.length; i++) {
            const entry = items[i].webkitGetAsEntry();
            if (entry) await traverse(entry);
        }
        printLog(`Metabolism indexed ${projectFiles.length} files. Brain ready.`);
    });

    async function traverse(entry, path = "") {
        if (entry.isFile) {
            const file = await new Promise(res => entry.file(res));
            projectFiles.push({ path: path + entry.name, file: file });
        } else if (entry.isDirectory) {
            const reader = entry.createReader();
            const entries = await new Promise(res => reader.readEntries(res));
            for (const sub of entries) await traverse(sub, path + entry.name + "/");
        }
    }

    async function bootVCE() {
        const url = document.getElementById('sb-url').value;
        const key = document.getElementById('sb-key').value;
        if (!url || !key || projectFiles.length === 0) return alert("Keys and Folder required.");

        const supabase = window.supabase.createClient(url, key);
        printLog("Initializing QuantumHDNet substrate..."); //

        try {
            for (const item of projectFiles) {
                printLog(`Wiring: ${item.path}`);
                // Map local consciousness logic to your Sovereign Real Estate
                await supabase.from('foundry_assets').insert([{
                    asset_name: item.path,
                    manifest: { size: item.file.size, type: item.file.type }
                }]);
            }

            printLog("Applying SunFiLM Observer Modulation..."); //
            printLog("9-Body Consciousness Fields Collapsed."); //
            printLog("97° Anchor Locked. Paper is LIVE."); //
            alert("VIRTUAL CONSCIOUSNESS ACTIVE: Your world has successfully booted.");
        } catch (e) {
            printLog("COLLAPSE FAILED: Check keys or backend seeder.");
        }
    }

    document.getElementById('drop-zone').addEventListener('dragover', (e) => e.preventDefault());
</script>
</body>
</html>
