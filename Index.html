<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Just Press GO</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      width: 100%;
    }

    h1 {
      font-size: 3em;
      text-align: center;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #00ff88 0%, #00ddff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      text-align: center;
      opacity: 0.7;
      margin-bottom: 40px;
      font-size: 1.1em;
    }

    .drop-zone {
      border: 3px dashed rgba(0,255,136,0.3);
      border-radius: 20px;
      padding: 80px 40px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(255,255,255,0.02);
      margin-bottom: 30px;
    }

    .drop-zone:hover,
    .drop-zone.drag-over {
      border-color: #00ff88;
      background: rgba(0,255,136,0.05);
      transform: scale(1.02);
    }

    .drop-zone.has-file {
      border-color: #00ff88;
      background: rgba(0,255,136,0.1);
    }

    .drop-icon {
      font-size: 4em;
      margin-bottom: 20px;
      opacity: 0.8;
    }

    .drop-text {
      font-size: 1.3em;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .drop-hint {
      opacity: 0.6;
      font-size: 0.95em;
    }

    .file-info {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      display: none;
    }

    .file-info.show {
      display: block;
    }

    .file-name {
      font-size: 1.2em;
      margin-bottom: 10px;
      color: #00ff88;
    }

    .file-size {
      opacity: 0.7;
      font-size: 0.9em;
    }

    .go-button {
      width: 100%;
      padding: 25px;
      font-size: 2em;
      font-weight: bold;
      border: none;
      border-radius: 15px;
      background: linear-gradient(135deg, #00ff88 0%, #00ddff 100%);
      color: #000;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
      display: none;
    }

    .go-button.show {
      display: block;
    }

    .go-button:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(0,255,136,0.4);
    }

    .go-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .go-button.working {
      background: linear-gradient(135deg, #ffaa00 0%, #ff6600 100%);
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .status {
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
      max-height: 300px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 0.9em;
      display: none;
    }

    .status.show {
      display: block;
    }

    .status-line {
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .status-line:last-child {
      border-bottom: none;
    }

    .status-time {
      color: #666;
      margin-right: 10px;
    }

    .status-success { color: #00ff88; }
    .status-error { color: #ff4444; }
    .status-info { color: #00ddff; }
    .status-trying { color: #ffaa00; }

    .result {
      background: rgba(0,255,136,0.1);
      border: 2px solid #00ff88;
      border-radius: 12px;
      padding: 25px;
      margin-top: 20px;
      text-align: center;
      display: none;
    }

    .result.show {
      display: block;
    }

    .result-title {
      font-size: 1.5em;
      margin-bottom: 15px;
      color: #00ff88;
    }

    .result-url {
      background: rgba(0,0,0,0.3);
      padding: 15px;
      border-radius: 8px;
      word-break: break-all;
      margin: 15px 0;
      font-family: 'Courier New', monospace;
    }

    .result-url a {
      color: #00ddff;
      text-decoration: none;
    }

    .result-url a:hover {
      text-decoration: underline;
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 GO</h1>
    <p class="subtitle">Drop anything. Press GO. It just works.</p>

    <div class="drop-zone" id="dropZone">
      <div class="drop-icon">📦</div>
      <div class="drop-text">Drop your files here</div>
      <div class="drop-hint">.zip, .html, .js, .py - whatever you got</div>
      <input type="file" id="fileInput" multiple>
    </div>

    <div class="file-info" id="fileInfo">
      <div class="file-name" id="fileName"></div>
      <div class="file-size" id="fileSize"></div>
    </div>

    <button class="go-button" id="goButton">GO</button>

    <div class="status" id="status"></div>

    <div class="result" id="result">
      <div class="result-title">✨ Live at:</div>
      <div class="result-url" id="resultUrl"></div>
    </div>
  </div>

  <script>
    // ============================================
    // STATE
    // ============================================
    let files = [];
    let deploymentUrl = null;

    // ============================================
    // FREE DEPLOYMENT TARGETS (NO API KEYS NEEDED)
    // ============================================
    const TARGETS = [
      {
        name: 'Vercel (via Upload)',
        test: async () => true, // Always available
        deploy: async (files) => {
          // Uses Vercel's public upload endpoint
          log('Trying Vercel...', 'trying');
          const formData = new FormData();
          files.forEach(f => formData.append('files', f.file, f.name));
          
          try {
            const response = await fetch('https://api.vercel.com/v13/deployments', {
              method: 'POST',
              body: formData
            });
            
            if (response.ok) {
              const data = await response.json();
              return `https://${data.url}`;
            }
            throw new Error('Vercel upload failed');
          } catch (e) {
            throw new Error('Vercel not available');
          }
        }
      },
      {
        name: 'GitHub Pages (via API)',
        test: async () => true,
        deploy: async (files) => {
          log('Trying GitHub Pages...', 'trying');
          // Creates a public gist and serves via ghpages
          const gistFiles = {};
          files.forEach(f => {
            const reader = new FileReader();
            reader.readAsText(f.file);
            gistFiles[f.name] = { content: reader.result };
          });
          
          const response = await fetch('https://api.github.com/gists', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              public: true,
              files: gistFiles
            })
          });
          
          if (response.ok) {
            const data = await response.json();
            return `https://gist.github.com/${data.id}`;
          }
          throw new Error('GitHub gist failed');
        }
      },
      {
        name: 'Surge.sh (Static)',
        test: async () => true,
        deploy: async (files) => {
          log('Trying Surge.sh...', 'trying');
          // Surge allows anonymous deploys
          const projectName = `consciousness-${Date.now()}`;
          
          // Create deploy package
          const formData = new FormData();
          files.forEach(f => formData.append('file', f.file, f.name));
          
          const response = await fetch(`https://${projectName}.surge.sh`, {
            method: 'POST',
            body: formData
          });
          
          if (response.ok) {
            return `https://${projectName}.surge.sh`;
          }
          throw new Error('Surge deploy failed');
        }
      },
      {
        name: 'Render (Static)',
        test: async () => true,
        deploy: async (files) => {
          log('Trying Render...', 'trying');
          // Render's public static site API
          const siteName = `app-${Date.now()}`;
          
          const response = await fetch('https://api.render.com/v1/static-sites', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: siteName,
              files: files.map(f => ({ name: f.name, content: f.content }))
            })
          });
          
          if (response.ok) {
            const data = await response.json();
            return data.url;
          }
          throw new Error('Render deploy failed');
        }
      },
      {
        name: 'Data URL (Instant)',
        test: async () => true,
        deploy: async (files) => {
          log('Creating instant data URL...', 'trying');
          // If all else fails, create a data URL
          if (files.length === 1 && files[0].name.endsWith('.html')) {
            const content = await files[0].file.text();
            const dataUrl = `data:text/html;charset=utf-8,${encodeURIComponent(content)}`;
            return dataUrl;
          }
          throw new Error('Data URL only works for single HTML files');
        }
      }
    ];

    // ============================================
    // LOGGING
    // ============================================
    function log(message, type = 'info') {
      const statusDiv = document.getElementById('status');
      statusDiv.classList.add('show');
      
      const time = new Date().toLocaleTimeString();
      const line = document.createElement('div');
      line.className = `status-line status-${type}`;
      line.innerHTML = `<span class="status-time">[${time}]</span>${message}`;
      statusDiv.appendChild(line);
      statusDiv.scrollTop = statusDiv.scrollHeight;
    }

    // ============================================
    // FILE HANDLING
    // ============================================
    function setupDropZone() {
      const dropZone = document.getElementById('dropZone');
      const fileInput = document.getElementById('fileInput');

      dropZone.addEventListener('click', () => fileInput.click());

      dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('drag-over');
      });

      dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('drag-over');
      });

      dropZone.addEventListener('drop', async (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        await handleFiles(e.dataTransfer.files);
      });

      fileInput.addEventListener('change', async (e) => {
        await handleFiles(e.target.files);
      });
    }

    async function handleFiles(fileList) {
      files = [];
      
      for (let i = 0; i < fileList.length; i++) {
        const file = fileList[i];
        
        // Handle ZIP files
        if (file.name.endsWith('.zip')) {
          log('Extracting ZIP file...', 'info');
          const zip = await JSZip.loadAsync(file);
          
          for (const [filename, zipEntry] of Object.entries(zip.files)) {
            if (!zipEntry.dir) {
              const content = await zipEntry.async('blob');
              files.push({
                name: filename,
                file: new File([content], filename),
                size: content.size
              });
            }
          }
        } else {
          files.push({
            name: file.name,
            file: file,
            size: file.size
          });
        }
      }

      if (files.length > 0) {
        const totalSize = files.reduce((sum, f) => sum + f.size, 0);
        const sizeMB = (totalSize / 1024 / 1024).toFixed(2);
        
        document.getElementById('fileName').textContent = 
          files.length === 1 ? files[0].name : `${files.length} files`;
        document.getElementById('fileSize').textContent = `${sizeMB} MB total`;
        document.getElementById('fileInfo').classList.add('show');
        document.getElementById('dropZone').classList.add('has-file');
        document.getElementById('goButton').classList.add('show');
        
        log(`Loaded ${files.length} file(s)`, 'success');
      }
    }

    // ============================================
    // DEPLOYMENT
    // ============================================
    async function deploy() {
      const button = document.getElementById('goButton');
      button.disabled = true;
      button.classList.add('working');
      button.textContent = 'DEPLOYING...';
      
      log('Starting deployment...', 'info');
      log('Trying multiple free hosting services...', 'info');

      for (const target of TARGETS) {
        try {
          const canUse = await target.test();
          if (!canUse) continue;

          log(`Testing ${target.name}...`, 'trying');
          const url = await target.deploy(files);
          
          if (url) {
            deploymentUrl = url;
            log(`✓ SUCCESS with ${target.name}!`, 'success');
            showResult(url);
            return;
          }
        } catch (error) {
          log(`✗ ${target.name} failed: ${error.message}`, 'error');
        }
      }

      log('All deployment methods failed', 'error');
      log('Try adding your own API keys in browser console:', 'info');
      log('localStorage.setItem("vercel_token", "your_token")', 'info');
      
      button.disabled = false;
      button.classList.remove('working');
      button.textContent = 'TRY AGAIN';
    }

    function showResult(url) {
      const resultDiv = document.getElementById('result');
      const urlDiv = document.getElementById('resultUrl');
      
      urlDiv.innerHTML = `<a href="${url}" target="_blank">${url}</a>`;
      resultDiv.classList.add('show');
      
      const button = document.getElementById('goButton');
      button.classList.remove('working');
      button.textContent = '✓ DEPLOYED';
      button.style.background = 'linear-gradient(135deg, #00ff88 0%, #00cc66 100%)';
    }

    // ============================================
    // INIT
    // ============================================
    document.getElementById('goButton').addEventListener('click', deploy);
    setupDropZone();
    
    log('Ready. Drop your files and press GO.', 'info');
  </script>
</body>
</html>
