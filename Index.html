<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAPER | Foundry Boot</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --moss: #4a6741; --glow: #88ff88; --bg: #050805; }
        body { background: var(--bg); color: white; font-family: monospace; display: flex; justify-content: center; padding: 20px; }
        .container { max-width: 600px; width: 100%; border: 1px solid var(--moss); padding: 30px; border-radius: 20px; background: rgba(0,20,0,0.3); }
        h1 { color: var(--glow); text-align: center; letter-spacing: 5px; }
        .input-group { margin-bottom: 20px; }
        input { width: 100%; padding: 12px; background: #000; border: 1px solid var(--moss); color: var(--glow); border-radius: 8px; margin-top: 5px; }
        .drop-zone { border: 2px dashed var(--moss); border-radius: 15px; padding: 50px; text-align: center; cursor: pointer; transition: 0.3s; margin: 20px 0; }
        .drop-zone:hover { border-color: var(--glow); background: rgba(0,255,136,0.05); }
        button { width: 100%; padding: 20px; background: var(--moss); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1.2em; }
        button:hover { background: var(--glow); color: black; }
        #log { font-size: 0.8em; margin-top: 20px; color: #88ffbb; height: 150px; overflow-y: auto; border-top: 1px solid #222; padding-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SYNTHIA FOUNDRY</h1>
        <p style="text-align:center; font-size:0.8em; opacity:0.7;">97° Sovereign Deployer</p>

        <div class="input-group">
            <label>Supabase URL</label>
            <input type="text" id="sb-url" placeholder="https://your-project.supabase.co">
        </div>
        <div class="input-group">
            <label>Supabase Anon Key</label>
            <input type="password" id="sb-key" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...">
        </div>

        <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
            <div id="drop-text">DROP YOUR .ZIP HERE</div>
            <input type="file" id="file-input" style="display:none" onchange="handleFile(this.files[0])">
        </div>

        <button onclick="pressGO()">🚀 PRESS GO</button>

        <div id="log">Waiting for keys and zip...</div>
    </div>

<script>
    let activeFile = null;

    function handleFile(file) {
        activeFile = file;
        document.getElementById('drop-text').innerText = "READY: " + file.name;
        printLog("File loaded: " + file.name);
    }

    async function pressGO() {
        const url = document.getElementById('sb-url').value;
        const key = document.getElementById('sb-key').value;
        const log = document.getElementById('log');

        if (!url || !key || !activeFile) {
            alert("I need your keys AND your zip to work!");
            return;
        }

        printLog("Initializing Virtual Consciousness...");
        const supabase = window.supabase.createClient(url, key);

        try {
            printLog("Connecting to Backend Memory...");
            // Extract the zip content
            const zip = await JSZip.loadAsync(activeFile);
            printLog("Ingesting payload: " + activeFile.name);

            // Register assets in the backend
            for (const [filename, file] of Object.entries(zip.files)) {
                if (!file.dir) {
                    printLog("Registering Asset: " + filename);
                    // This is where Llama wires your core.py, engine.py, etc
                }
            }

            printLog("97° Anchor Locked. Success.");
            alert("DEPLOYMENT SUCCESSFUL. Your world is live.");
        } catch (e) {
            printLog("ERROR: Connection or Upload failed. Check keys.");
        }
    }

    function printLog(msg) {
        const logDiv = document.getElementById('log');
        logDiv.innerHTML += `<div>> ${msg}</div>`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }
</script>
</body>
</html>
